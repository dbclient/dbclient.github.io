<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <title>Node APK - Download</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #09090b;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 40px 28px;
            background: #141418;
            border: 1px solid #292930;
            border-radius: 20px;
        }

        .icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #22222a;
            border-radius: 22px;
            font-size: 38px;
        }

        h1 {
            font-size: 29px;
            margin-bottom: 10px;
        }

        .description {
            color: #9999a5;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .download {
            display: block;
            width: 100%;
            padding: 16px;
            background: #ffffff;
            color: #09090b;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            transition: 0.2s;
        }

        .download:hover {
            background: #d4d4d8;
            transform: translateY(-2px);
        }

        .info {
            margin-top: 20px;
            color: #777783;
            font-size: 12px;
        }

        footer {
            margin-top: 35px;
            color: #555560;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">📦</div>

        <h1>Node APK</h1>

        <p class="description">
            Download the latest version of Node

        </p>

        </a>

        <p class="info">

        </p>

        <footer>
            © 2026 Node. All rights reserved.

</html>
